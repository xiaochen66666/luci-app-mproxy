name: Build

on:
  push:
    tags:
      - v*.**

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    # 关键：添加权限配置，允许GITHUB_TOKEN创建Release和上传文件
    permissions:
      contents: write
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a9
        sdk:
          - openwrt-23.05.3

    steps:
      # 更新到v4版本
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 构建OpenWrt包
      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@go1.20
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: luci-app-mproxy
          NO_REFRESH_CHECK: true

      # 上传构建产物作为工作流工件（可在Actions页面下载）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
          # v4新增选项：如果文件不存在则忽略
          if-no-files-found: ignore

      # 上传到GitHub Release（使用默认GITHUB_TOKEN）
      - name: Upload packages
        uses: ncipollo/release-action@v1.14.0
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用GitHub自动提供的令牌
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
          # 可选：添加Release说明
          body: |
            自动构建的OpenWrt包
            架构: ${{ matrix.arch }}
            SDK: ${{ matrix.sdk }}
