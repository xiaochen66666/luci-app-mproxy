name: Build Packages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: 'arm_cortex-a9'
        type: choice
        options:
          - arm_cortex-a9
      tag:
        description: 'OpenWrt版本'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - openwrt-24.10
          - openwrt-25.12

jobs:
  build:
    name: Build ${{ github.event.inputs.arch || matrix.arch }}-${{ github.event.inputs.tag || matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - ${{ github.event.inputs.arch || 'arm_cortex-a9' }}
        tag:
          - ${{ github.event.inputs.tag || 'openwrt-24.10' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build preparation
        run: |
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' mosdns/Makefile
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' v2dat/Makefile
          git clone https://github.com/sbwml/v2ray-geodata
          echo "SKIP_BUILD=0" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.tag || matrix.tag }}" = "openwrt-25.12" ] && [ "${{ github.event.inputs.arch || matrix.arch }}" = "riscv64_riscv64" ]; then
            echo "EFFECTIVE_ARCH=riscv64_generic" >> $GITHUB_ENV
            echo "ARCH=riscv64_generic-${{ github.event.inputs.tag || matrix.tag }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.tag || matrix.tag }}" = "openwrt-25.12" ] && [ "${{ github.event.inputs.arch || matrix.arch }}" = "mips_4kec" ]; then
            echo "SKIP_BUILD=1" >> $GITHUB_ENV
          else
            echo "EFFECTIVE_ARCH=${{ github.event.inputs.arch || matrix.arch }}" >> $GITHUB_ENV
            echo "ARCH=${{ github.event.inputs.arch || matrix.arch }}-${{ github.event.inputs.tag || matrix.tag }}" >> $GITHUB_ENV
          fi

      - name: Build Packages
        if: ${{ env.SKIP_BUILD == '0' }}
        uses: sbwml/openwrt-gh-action-sdk@go1.26
        env:
          FEEDNAME: packages_ci
          PACKAGES: luci-app-mproxy
          NO_REFRESH_CHECK: true

      - name: Create compress files
        if: ${{ env.SKIP_BUILD == '0' }}
        continue-on-error: true
        run: |
          tar -zcvf ${{ env.ARCH }}.tar.gz -C bin/packages/${{ env.EFFECTIVE_ARCH }}/ packages_ci

      - name: Upload packages
        if: ${{ env.SKIP_BUILD == '0' }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || format('manual-{0}-{1}', github.event.inputs.arch, github.event.inputs.tag) }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "${{ env.ARCH }}.tar.gz"
