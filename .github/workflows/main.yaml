name: Build

on:
  # 保留原有的标签触发
  push:
    tags:
      - v*.**

  # 添加手动触发（workflow_dispatch）
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: true
        default: 'mvebu-cortexa9'
        type: choice
        options:
          - mvebu-cortexa9
          - ramips-mt7621
          - x86_64
      sdk_version:
        description: 'SDK版本'
        required: true
        default: '23.05.1'
        type: choice
        options:
          - '23.05.1'
          - '22.03.5'
          - '21.02.7'
      package:
        description: '要构建的软件包（多个用空格分隔）'
        required: true
        default: 'luci-app-mproxy'

jobs:
  build:
    name: Build ${{ github.event.inputs.arch || matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # 当手动触发时，使用workflow_dispatch的输入值
        # 当标签触发时，使用默认值
        arch:
          - ${{ github.event.inputs.arch || 'mvebu-cortexa9' }}
        sdk_version:
          - ${{ github.event.inputs.sdk_version || '23.05.1' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        uses: sbwml/openwrt-gh-action-sdk@go1.20
        env:
          CONTAINER: fasheng/openwrt-buildsdk
          # 使用动态的ARCH格式
          ARCH: ${{ matrix.sdk_version }}-${{ matrix.arch }}
          FEEDNAME: packages_ci
          # 支持手动输入多个包
          PACKAGES: ${{ github.event.inputs.package || 'luci-app-mproxy' }}
          NO_REFRESH_CHECK: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk_version }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
          if-no-files-found: ignore

      - name: Upload packages
        uses: ncipollo/release-action@v1.14.0
        with:
          name: ${{ github.ref_name || format('manual-build-{0}', github.run_number) }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
          # 如果是手动触发，添加说明
          body: |
            ${{ github.event.inputs.package && format('手动构建: {0}', github.event.inputs.package) || '自动标签构建' }}
            架构: ${{ matrix.arch }}
            SDK版本: ${{ matrix.sdk_version }}
            ${{ github.event.inputs.arch && format('触发者: {0}', github.actor) || '' }}
