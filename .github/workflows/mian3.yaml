name: Build Custom Package with Custom Feed

on:
  workflow_dispatch:
    inputs:
      feed_name:
        description: 'Feed源名称(多个用|分隔，例如: feed1|feed2)'
        required: true
        type: string
      repo_url:
        description: '仓库地址(多个用|分隔，例如: url1|url2)'
        required: true
        type: string
      branch:
        description: '分支(多个用|分隔，例如: main|openwrt-22.03)'
        required: true
        default: 'main'
        type: string
      package_name:
        description: '要编译的插件包名，多个用空格分隔 (例如: luci-app-mproxy luci-app-ddns)'
        required: true
        type: string
      arch:
        description: '目标架构，多个用空格分隔 (例如: arm_cortex-a9 aarch64_cortex-a72)'
        required: true
        default: 'arm_cortex-a9'
        type: string
      sdk:
        description: 'OpenWrt版本，多个用空格分隔 (例如: openwrt-22.03 openwrt-23.05)'
        required: true
        default: 'openwrt-22.03'
        type: string

jobs:
  # 第一步：解析输入，生成矩阵
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 生成矩阵配置
        id: set-matrix
        run: |
          # 将空格分隔的字符串转为JSON数组
          ARCH_JSON=$(echo '${{ github.event.inputs.arch }}' | sed 's/ /","/g' | sed 's/^/["/' | sed 's/$/"]/')
          SDK_JSON=$(echo '${{ github.event.inputs.sdk }}' | sed 's/ /","/g' | sed 's/^/["/' | sed 's/$/"]/')
          
          # 生成完整的矩阵JSON
          MATRIX_JSON=$(jq -n \
            --argjson arch "$ARCH_JSON" \
            --argjson sdk "$SDK_JSON" \
            '{arch: $arch, sdk: $sdk}')
          
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          echo "生成的矩阵: $MATRIX_JSON"

  # 第二步：使用矩阵并行编译
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建软件包
        uses: sbwml/openwrt-gh-action-sdk@go1.20
        env:
          EXTRA_FEEDS: ${{ format('src-git {0} {1}^{2}', github.event.inputs.feed_name, github.event.inputs.repo_url, github.event.inputs.branch) }}
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ github.event.inputs.package_name }}
          NO_REFRESH_CHECK: true

      - name: 上传编译产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
          if-no-files-found: ignore

      - name: 设置 Release 标签
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=manual-build-${{ github.run_number }}-${{ matrix.arch }}-${{ matrix.sdk }}" >> $GITHUB_OUTPUT
            echo "name=Manual Build #${{ github.run_number }} (${{ matrix.arch }}-${{ matrix.sdk }})" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}-${{ matrix.arch }}-${{ matrix.sdk }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.ref_name }} (${{ matrix.arch }}-${{ matrix.sdk }})" >> $GITHUB_OUTPUT
          fi

      - name: 上传到 Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ steps.release_tag.outputs.name }}
          tag: ${{ steps.release_tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
